services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-https://bright-carwash-api.pixelstack.cloud/api}
        NEXT_PUBLIC_STORAGE_URL: ${NEXT_PUBLIC_STORAGE_URL:-https://s3.us-east-1.amazonaws.com/bright-side-car-wash}
        NEXT_PUBLIC_AI_BASE_URL: ${NEXT_PUBLIC_AI_BASE_URL:-https://bright-carwash-ai.pixelstack.cloud/api/v1}
        NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL:-}
        NEXT_PUBLIC_MOCK_MODE: ${NEXT_PUBLIC_MOCK_MODE:-false}
    image: dashboard-frontend-car-wash-admin
    container_name: dashboard-frontend-car-wash-admin
    restart: unless-stopped
    ports:
      - "3001:3000"
    env_file:
      - .env
    working_dir: /usr/src/app
    command: npm start
